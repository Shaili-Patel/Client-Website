<!doctype html>
<html lang="en">
<head>
  <title>Treats By Tab</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://use.typekit.net/yge1dfx.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Treats By Tab</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#menu">Menu</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#order">Order</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main>

<!-- HOME -->

  <div id="hero-banner">
    <div class="hero-content">
      <h1>
        <span>Fresh</span>
        <span>Baked</span>
        <span>Daily</span>
      </h1>
      <button class="btn btn-light">Shop Now</button>
    </div>
  </div>

<!-- MENU -->
<section id="menu">
  <h2>Menu</h2>
  <div class="side-by-side">
    <div class="side-by-side__image">
      <img src="https://picsum.photos/seed/1/400/300">
    </div>
    <div class="side-by-side__text">
      <h3>Cookies</h3>
      <p>Fresh baked cookies made daily.</p>
    </div>

    <div class="side-by-side__text">
      <h3>Cupcakes</h3>
      <p>Soft, fluffy, and topped with buttercream.</p>
    </div>
    <div class="side-by-side__image">
      <img src="https://picsum.photos/seed/2/400/300">
    </div>
  </div>
</section>

<!-- ORDER -->
 <section id="order">
 <div class="order-card">
  <form class="order-form">

    <h4>Custom Order</h4>

    <label>Name</label>
    <input type="text" required>

    <label>Email</label>
    <input type="email" required>

    <label>Order Type</label>
    <select required>
      <option>Cupcakes</option>
      <option>Cookies</option>
    </select>

    <label>Pickup Date</label>
    <input type="date" required>
<br>
<br>
    <h4>Allergies</h4>
    <div class="order-checkbox-group">
      <label><input type="checkbox"> Nuts</label>
      <label><input type="checkbox"> Dairy</label>
      <label><input type="checkbox"> Gluten</label>
      <label><input type="checkbox"> Eggs</label>
      <label><input type="checkbox"> Soy</label>
      <label><input type="checkbox"> None</label>
    </div>

    <label>Allergy Details</label>
    <textarea rows="3"></textarea>
<br>
    <h4>Preferences</h4>

    <label>Flavor</label>
    <input type="text">

    <label>Design Notes</label>
    <textarea rows="3"></textarea>

    <button type="submit">Submit</button>

  </form>
</div>
</section>

<!-- Footer -->
<footer class="site-footer">
  <div class="footer-content">
    <h3>Treats By Tab</h3>

    <div class="footer-links">
      <a href="#home">Home</a>
      <a href="#menu">Menu</a>
      <a href="#order">Order</a>
    </div>

    <div class="footer-social">
      <a href="https://instagram.com/YOUR_USERNAME" target="_blank">
        <img src="imgs/instagram.png" alt="Instagram">
      </a>
    </div>
  </div>
</footer>

</main>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
