<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Cart</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.typekit.net/yge1dfx.css">
  <link rel="stylesheet" href="https://use.typekit.net/cqy3hka.css">
  
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
  <div class="container-fluid">
     <img src="imgs/logo.png" class="nav-logo me-2" alt="Logo">
    <a class="navbar-brand" href="index.html">Treats By Tab</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html#menu">Menu</a>
        </li>
          <a class="nav-link active" href="cart.html">
            Cart (<span id="cart-count">0</span>)
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<section id="cart">
  <h2 class="text-center">Cart</h2>

  <div id="cart-items"></div>
<div class="order-notes">
  <label for="order-note">Anything you'd like us to know?</label>
  <textarea id="order-note"
  placeholder="Birthday, allergies, message on box, etc..."
  oninput="saveOrderNote()"></textarea>
</div>
  <div class="total" id="cart-total">Total: $0</div>

  <button class="checkout-btn">Checkout</button>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
